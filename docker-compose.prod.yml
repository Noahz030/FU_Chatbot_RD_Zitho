version: "3.9"

services:
  # Arena API - OpenWebUI-kompatible API mit RAG
  arena-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fu-arena-api
    env_file:
      - .env.production
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "LOCAL"  # Set to LOCAL for testing (no API key), PRODUCTION for deployment
      # Arena-specific
      STORAGE_PATH: /app/src/openwebui/data/arena_votes.jsonl
      # Azure Key Vault integration
      USE_KEY_VAULT: "${USE_KEY_VAULT:-true}"
      KEY_VAULT_NAME: "${KEY_VAULT_NAME:-kicwa-keyvault-prod}"
      # CORS Origins from environment
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - ./src/openwebui/data:/app/src/openwebui/data
    ports:
      - "127.0.0.1:8001:8001"  # Only bind to localhost, nginx will proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - arena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Voting UI - FastAPI interface
  arena-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: fu-arena-ui
    environment:
      API_BASE_URL: http://arena-api:8001
      PYTHONUNBUFFERED: "1"
      # Override API base for production (use internal docker network)
      ARENA_API_BASE: "http://arena-api:8001"
    depends_on:
      arena-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"  # Only bind to localhost, nginx will proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - arena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy + TLS
  nginx:
    image: nginx:stable-alpine
    container_name: fu-arena-nginx
    depends_on:
      arena-api:
        condition: service_healthy
      arena-ui:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf.prod:/etc/nginx/nginx.conf:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - arena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for Let's Encrypt SSL Certificates
  certbot:
    image: certbot/certbot:latest
    container_name: fu-arena-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - arena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL (optional, for future use)
  postgres:
    image: postgres:16-alpine
    container_name: fu-arena-postgres
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - arena_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_user -d arena"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arena_data:
    driver: local
  postgres_data:
    driver: local
  nginx_cache:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  arena_network:
    driver: bridge
