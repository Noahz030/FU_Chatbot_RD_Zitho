version: "3.9"

# Local Testing Docker Compose
# Uses self-signed SSL certificates instead of Let's Encrypt
# Perfect for end-to-end testing before production deployment

services:
  # Arena API - OpenWebUI-compatible API with RAG
  arena-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: arena-api-local
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "LOCAL"
      STORAGE_PATH: /data/arena_votes.jsonl
      USE_KEY_VAULT: "false"
      # Test mode: No API key required for Arena endpoints
      ARENA_API_KEY: ""
    volumes:
      - arena_data_local:/data
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - arena_network_local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Voting UI - FastAPI interface
  arena-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: arena-ui-local
    environment:
      API_BASE_URL: http://arena-api:8001
      PYTHONUNBUFFERED: "1"
    depends_on:
      arena-api:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - arena_network_local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy + Self-Signed SSL
  nginx:
    image: nginx:stable-alpine
    container_name: arena-nginx-local
    depends_on:
      arena-api:
        condition: service_healthy
      arena-ui:
        condition: service_healthy
    environment:
      - DOMAIN_NAME=localhost
    volumes:
      - ./nginx/nginx.conf.local:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache_local:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - arena_network_local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL (optional, for future use)
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres-local
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_test_password}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - arena_network_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_user -d arena"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arena_data_local:
    driver: local
  postgres_data_local:
    driver: local
  nginx_cache_local:
    driver: local

networks:
  arena_network_local:
    driver: bridge
