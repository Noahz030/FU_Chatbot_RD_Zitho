name: rag
services:
  langfuse:
    image: langfuse/langfuse:2.69.0
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: 'postgres:5432'
      DATABASE_NAME: 'langfuse'
      DATABASE_USERNAME: 'postgres'
      DATABASE_PASSWORD: 'test!123PW_'
      NEXTAUTH_SECRET: 'mysecret'
      SALT: 'mysalt'
      NEXTAUTH_URL: 'http://localhost:3000'
      TELEMETRY_ENABLED: false
      LANGFUSE_DEFAULT_PROJECT_ID: kicwa
      LANGFUSE_DEFAULT_PROJECT_ROLE: 'ADMIN'


  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: 'test!123PW_'
      POSTGRES_USER: 'postgres'
      POSTGRES_DB: 'postgres'

  arena-api:
    build:
      context: .
      dockerfile: src/arena/Dockerfile
    ports:
      - "8011:8001"
    env_file:
      - .env
    depends_on:
      - langfuse
    environment:
      - LANGFUSE_HOST=http://langfuse:3000
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3001:8080"
    environment:
      - WEBUI_SECRET_KEY=your-secret-key-here
      - CORS_ALLOW_ORIGIN=*
      - OPENAI_API_BASE_URL=http://arena-api:8001/v1
      - OPENAI_API_KEY=local-dev-key
      - DEFAULT_ADMIN_EMAIL=admin@localhost
      - DEFAULT_ADMIN_PASSWORD=TempAdmin123!
    restart: unless-stopped
