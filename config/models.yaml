# Model Registry Configuration
# Defines all available chatbot versions for Arena
# Version-agnostic configuration enables plug-and-play version management

models:
  # Original KI-Campus Assistant (External - kic-web-assistant)
  # Proxies to external API running on port 9001
  kicampus-v1:
    name: "KI-Campus (Original)"
    description: "Original chatbot from scieneers/kic-web-assistant repository"
    enabled: true
    params:
      context_window: 10
      model_enum: "gpt4"
      # HTTP Proxy configuration
      api_base_url: "http://chatbot-original"  # Docker service name (or localhost:9001 for local testing)
      api_key: "arena-test-key"
      timeout: 60
    source: "src.llm.http_proxy_assistant:HTTPProxyAssistant"
    release_date: "2024-01-01"
    tags:
      - "original"
      - "baseline"
      - "external"
      - "kic-web-assistant"

  # Improved KI-Campus Assistant (External - FU_Chatbot)
  # Proxies to external API running on port 9002
  kicampus-v1-improved:
    name: "KI-Campus (Improved)"
    description: "Enhanced chatbot from KI-Campus/FU_Chatbot repository"
    enabled: true
    params:
      context_window: 15
      model_enum: "gpt4"
      # HTTP Proxy configuration
      api_base_url: "http://chatbot-improved"  # Docker service name (or localhost:9002 for local testing)
      api_key: "arena-test-key"
      timeout: 60
    source: "src.llm.http_proxy_assistant:HTTPProxyAssistant"
    release_date: "2025-06-01"
    tags:
      - "improved"
      - "extended-context"
      - "external"
      - "fu-chatbot"

  # KI-Campus v2 (Future - from upstream)
  # Uncomment when available in upstream repository
  # kicampus-v2:
  #   name: "KI-Campus v2.0"
  #   description: "Next generation chatbot with improved reasoning"
  #   enabled: false
  #   params:
  #     context_window: 20
  #     model_enum: "gpt4"
  #   source: "src.llm.assistant_v2:KICampusAssistantV2"
  #   release_date: "2026-01-15"
  #   tags:
  #     - "v2"
  #     - "extended-context"
  #     - "testing"

# Arena configuration
arena:
  # List of model IDs enabled in voting UI
  # Add/remove model IDs here to control which versions are available for voting
  enabled_models:
    - "kicampus-v1"
    - "kicampus-v1-improved"
    # - "kicampus-v2"  # Uncomment to enable v2 in Arena

  # Default model to use if not specified
  default_model: "kicampus-v1-improved"

  # Model comparison settings
  comparison:
    # Allow voting on different versions
    allow_version_comparisons: true
    
    # Track version info in votes
    track_version_metadata: true

# Configuration metadata
_metadata:
  version: "1.0"
  last_updated: "2026-01-09"
  description: "Plug-and-play model registry for Chatbot Arena"
  documentation: "See CHATBOT_VERSIONING.md for implementation details"
